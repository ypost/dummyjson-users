services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    user: "1000:1000"
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      XDEBUG_CONFIG: "client_host=host.docker.internal client_port=9003 idekey=PHPSTORM"
      XDEBUG_MODE: "debug"
      COMPOSER_ROOT_VERSION: "dev-main"
